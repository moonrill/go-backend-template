version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/platform/postgres/queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              type: "string"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true


